name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25.6"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version files
        run: |
          go run scripts/update-version.go ${{ steps.version.outputs.version }}

      - name: Run tests
        run: make test

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/scaffoldgen-linux-amd64 ./cmd/scaffoldgen
          GOOS=linux GOARCH=arm64 go build -o dist/scaffoldgen-linux-arm64 ./cmd/scaffoldgen
          GOOS=darwin GOARCH=amd64 go build -o dist/scaffoldgen-darwin-amd64 ./cmd/scaffoldgen
          GOOS=darwin GOARCH=arm64 go build -o dist/scaffoldgen-darwin-arm64 ./cmd/scaffoldgen
          GOOS=windows GOARCH=amd64 go build -o dist/scaffoldgen-windows-amd64.exe ./cmd/scaffoldgen

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.version }}
          files: |
            dist/scaffoldgen-linux-amd64
            dist/scaffoldgen-linux-arm64
            dist/scaffoldgen-darwin-amd64
            dist/scaffoldgen-darwin-arm64
            dist/scaffoldgen-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
